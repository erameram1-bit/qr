<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직원 QR 주차카드 확인</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #1c1e21; }
        .card { max-width: 480px; margin: 20px auto; background: #ffffff; padding: 30px 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        h2 { text-align: center; color: #1b365d; margin-top: 0; font-size: 22px; border-bottom: 2px solid #e4e6eb; padding-bottom: 14px; }
        .desc { font-size: 16px; color: #333333; text-align: center; margin-bottom: 12px; font-weight: bold; }
        
        .notice-box { 
            font-size: 13px; 
            color: #555555; 
            background: #f8f9fa; 
            padding: 12px 14px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            line-height: 1.55; 
            border: 1px solid #e1e4e8; 
            text-align: justify; 
            word-break: keep-all; 
        }
        
        input[type="password"] { 
            width: 100%; 
            box-sizing: border-box; 
            padding: 16px; 
            border: 2px solid #ccd0d5; 
            border-radius: 10px; 
            font-size: 18px; 
            outline: none; 
            margin-bottom: 14px; 
            text-align: center; 
            letter-spacing: 2px;
        }
        input[type="password"]:focus { border-color: #2b579a; }
        
        button { 
            width: 100%; 
            background: #2b579a; 
            color: white; 
            border: none; 
            padding: 16px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:active { background: #1e3a68; }
        
        #resultArea { 
            margin-top: 24px; 
            padding: 22px; 
            background: #e7f3ff; 
            border-radius: 12px; 
            display: none; 
            white-space: pre-wrap; 
            font-size: 18px; 
            line-height: 1.8; 
            color: #050505; 
            border-left: 6px solid #2b579a; 
            font-weight: 600;
        }
        .error-msg { color: #e41e3f; font-weight: bold; text-align: center; margin-top: 12px; font-size: 15px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>직원 QR 주차카드 확인</h2>
        <p class="desc">보안 차량 정보를 확인하려면 비밀번호를 입력하세요.</p>
        
        <div class="notice-box">
            개인정보 보호법 제3조(개인정보 보호 원칙)에 따라, 본 QR 서비스는 최소한의 연결 기능만 수행하며 이용자의 연락처를 포함한 어떠한 개인정보도 수집·저장하지 않음을 보장합니다.
        </div>
        
        <input type="password" id="passInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') decryptQR()">
        <button onclick="decryptQR()">정보 확인</button>

        <div id="errorMsg" class="error-msg">❌ 비밀번호가 올바르지 않습니다.</div>
        <div id="resultArea"></div>
    </div>

    <script>
        async function decryptQR() {
            const password = document.getElementById('passInput').value;
            const resultDiv = document.getElementById('resultArea');
            const errorDiv = document.getElementById('errorMsg');

            errorDiv.style.display = 'none';

            if (!password) {
                alert('비밀번호를 입력해 주세요.');
                return;
            }

            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            let encodedData = params.get('d');

            if (!encodedData) {
                alert('유효하지 않은 QR 코드 링크입니다.');
                return;
            }

            try {
                const b64Data = decodeURIComponent(encodedData);
                const binaryStr = atob(b64Data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }

                const salt = bytes.slice(0, 16);
                const iv = bytes.slice(16, 28);
                const ciphertext = bytes.slice(28);

                const enc = new TextEncoder();
                const pwKey = await crypto.subtle.importKey(
                    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
                );

                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                    pwKey,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );

                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    ciphertext
                );

                const dec = new TextDecoder();
                const resultText = dec.decode(decryptedBuffer);

                resultDiv.innerText = resultText;
                resultDiv.style.display = 'block';
                document.getElementById('passInput').style.display = 'none';
                document.querySelector('button').style.display = 'none';
                document.querySelector('.notice-box').style.display = 'none';
                document.querySelector('.desc').innerText = '인증이 완료되었습니다.';

            } catch (err) {
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
